<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: pinch-zoom must stay available (WCAG 2.2 SC 1.4.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Static fallbacks: these ship in the served HTML, so crawlers and social
         scrapers that do not execute JavaScript still get real values.
         DynamicHead.tsx overwrites them with CMS site-settings once the app boots,
         and adds canonical / og:url / JSON-LD from the live origin. -->
    <title>Portal Resmi Nagari</title>
    <meta
      name="description"
      content="Portal resmi nagari: layanan surat online, data publik, infografis APB, monografi, berita nagari, UMKM, dan peta digital."
    />
    <meta
      name="keywords"
      content="portal nagari, layanan surat online, data publik nagari, infografis apb, umkm nagari, peta digital nagari"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101b1f" media="(prefers-color-scheme: dark)" />

    <meta property="og:title" content="Portal Resmi Nagari" />
    <meta
      property="og:description"
      content="Portal resmi nagari: layanan surat online, data publik, infografis APB, monografi, berita nagari, UMKM, dan peta digital."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Portal Nagari" />
    <meta property="og:locale" content="id_ID" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Portal Resmi Nagari" />
    <meta
      name="twitter:description"
      content="Portal resmi nagari: layanan surat online, data publik, infografis APB, monografi, berita nagari, UMKM, dan peta digital."
    />
    <meta name="twitter:image" content="/opengraph.jpg" />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Google Fonts: Plus Jakarta Sans (display/headings) + Inter (body),
         Newsreader (editorial serif for news articles). Weight ranges trimmed
         to what the UI asks for. Newsreader ships its italic axis because the
         article lead paragraph uses it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@600..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
